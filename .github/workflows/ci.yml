name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: ${{ matrix.example }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - sales-dashboard
          - webhooks-starter
          - shipping-carrier
          - payment-provider
          - terminal-provider
          - whatsapp-widget-script
          - installments-banner-script
        node: ["20.12", "22"]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json

      - name: Install (lockfile exacto)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Smoke
        run: npm run smoke
